<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aethelred Knives</title>
  <link rel="stylesheet" href="style.css">
  <!-- Подключаем изящный шрифт с засечками, похожий на оригинальный -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Playfair+Display:ital,wght@0,400..600;1,400&display=swap" rel="stylesheet">
</head>
<body>

  <div class="card-container">
    
    <!-- Навигационная панель -->
    <nav class="navbar">
      <a href="#" class="nav-link active">About Us</a>
      <a href="#" class="nav-link">Catalog</a>
      <a href="#" class="nav-link">Reviews</a>
      <a href="#" class="nav-link">Contacts</a>
    </nav>

    <!-- Основная карточка -->
    <div class="hero-card">
      <h1 class="main-title">AETHELRED KNIVES</h1>

      <!-- Правая панель с логотипом и описанием -->
      <div class="brand-info">
        <div class="logo-box">
          <!-- Замените logo.png на вашу иконку/логотип -->
          <img src="logotip.png" alt="Aethelred Knives Logo" class="logo-img">
        </div>
        <p class="tagline">Handcrafted knives from a private workshop</p>
      </div>

      <!-- Левый плавающий блок со статистикой -->
      <div class="stats-badge">
        +25,000 customers in 2025, +2 new stores in the city
      </div>

      <!-- Кнопка входа -->
      <div class="button-container">
        <button class="btn-login">Log in</button>
      </div>
    </div>

  </div>

</body>
</html>
